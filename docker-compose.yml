# ТрудКрутШоп — полный стек: Postgres + приложение + воркер + Caddy (TLS).
# Запуск: docker compose up -d --build
# Переменные (пароли, домен, ключи) берутся из .env рядом с этим файлом.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tksh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-tksh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tksh} -d ${POSTGRES_DB:-tksh}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Порт наружу не публикуем — доступ только внутри compose-сети.

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tksh}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tksh}?schema=public
      NODE_ENV: production
    # Применяем миграции перед стартом сервера (без сброса данных).
    command: >-
      sh -c "node node_modules/prisma/build/index.js migrate deploy && node server.js"
    expose:
      - "3000"

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tksh}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tksh}?schema=public
      NODE_ENV: production

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
